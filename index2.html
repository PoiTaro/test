<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#080604" />
<title>エアホッケー · P2P</title>
<style>
  :root {
    color-scheme: dark;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden; background: #080604;
    touch-action: manipulation; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none;
    font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  }
  canvas { display: block; touch-action: none; }

  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 42%, rgba(0,0,0,0.58) 100%);
  }

  #hud {
    position: fixed; inset: 0; pointer-events: none;
    color: #f1e3ca;
  }

  #scorebar {
    position: absolute;
    top: calc(var(--safe-t) + 10px);
    left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px;
    padding: 6px 18px;
    background: linear-gradient(180deg, rgba(40,27,16,.82), rgba(22,15,9,.88));
    border: 1px solid rgba(214,168,110,.38);
    border-radius: 10px;
    box-shadow: 0 6px 22px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,225,180,.15);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  #scorebar .side { display: flex; align-items: baseline; gap: 7px; }
  #scorebar .label {
    font-size: 9px; letter-spacing: .22em; opacity: .7; font-weight: 700; color: #d9c39c;
  }
  #scorebar .num {
    font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums;
    line-height: 1; min-width: 22px; text-align: center;
    font-family: "Courier New", monospace;
  }
  .you .num { color: #ffbe62; text-shadow: 0 0 14px rgba(255,170,60,.75); }
  .cpu .num { color: #ff8a72; text-shadow: 0 0 14px rgba(255,110,80,.75); }
  #scorebar .divider { opacity: .3; font-size: 16px; }

  #banner {
    position: absolute; top: 34%; left: 50%;
    transform: translate(-50%, -50%) scale(.92);
    font-size: clamp(28px, 9vw, 62px);
    font-weight: 900; letter-spacing: .05em;
    opacity: 0; text-align: center;
    transition: opacity .4s ease, transform .4s cubic-bezier(.2,1.6,.4,1);
    white-space: nowrap;
  }
  #banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #banner.you { color: #ffdd9e; text-shadow: 0 0 30px rgba(255,190,90,.9), 0 0 70px rgba(255,150,50,.5); }
  #banner.cpu { color: #ffb0a0; text-shadow: 0 0 30px rgba(255,110,80,.9), 0 0 70px rgba(255,80,50,.5); }
  #banner .sub {
    display: block; font-size: 0.26em; font-weight: 700;
    letter-spacing: .28em; margin-top: 0.9em; opacity: 0.7;
    animation: blink 1.4s ease-in-out infinite;
  }
  @keyframes blink { 0%,100% { opacity: .35; } 50% { opacity: .9; } }

  #hint {
    position: absolute;
    bottom: calc(var(--safe-b) + 16px);
    left: 50%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: .12em;
    color: #c9b48e; opacity: .68; white-space: nowrap;
    animation: hintFade 8s ease forwards;
  }
  @keyframes hintFade { 0%,55% { opacity: .68; } 100% { opacity: 0; } }

  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
  #flash.go { animation: flashAnim .55s ease-out; }
  @keyframes flashAnim { 0% { opacity: .45; } 100% { opacity: 0; } }

  #overlay {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 40%, rgba(30,20,12,.92) 0%, rgba(6,4,3,.96) 100%);
    z-index: 100;
    transition: opacity .3s ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }

  .panel {
    width: min(340px, 88vw);
    padding: 30px 26px;
    background: linear-gradient(180deg, rgba(40,27,16,.92), rgba(18,12,8,.95));
    border: 1px solid rgba(214,168,110,.42);
    border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,225,180,.12);
    text-align: center;
  }
  .panel h1 {
    font-size: 30px; font-weight: 900; letter-spacing: .08em;
    color: #ffeec8; text-shadow: 0 0 24px rgba(255,180,80,.6); margin-bottom: 8px;
  }
  .panel .subtitle { font-size: 11px; letter-spacing: .3em; color: #a89070; margin-bottom: 22px; }

  .btn {
    display: block; width: 100%;
    padding: 13px 0; margin-bottom: 10px;
    font-size: 15px; font-weight: 700; letter-spacing: .06em;
    color: #f0e0c0;
    background: linear-gradient(180deg, #3a2818, #251a10);
    border: 1px solid rgba(214,168,110,.4);
    border-radius: 8px; cursor: pointer;
    transition: all .15s ease; font-family: inherit;
  }
  .btn:hover, .btn:active { background: linear-gradient(180deg, #4a3420, #2e2013); transform: translateY(-1px); }
  .btn.primary {
    background: linear-gradient(180deg, #8a2020, #5a1010);
    border-color: rgba(255,120,80,.5); color: #fff5e0;
    box-shadow: 0 4px 20px rgba(160,40,30,.4);
  }
  .btn.primary:hover, .btn.primary:active { background: linear-gradient(180deg, #a82828, #6a1414); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  .hidden { display: none !important; }

  .code-display {
    font-family: "Courier New", monospace;
    font-size: 40px; font-weight: 900; letter-spacing: .2em;
    padding: 16px 0; margin: 12px 0 6px;
    color: #ffcc70; background: rgba(0,0,0,.35);
    border-radius: 8px; border: 1px solid rgba(214,168,110,.3);
    text-shadow: 0 0 20px rgba(255,180,80,.8);
    user-select: all;
  }

  .status {
    font-size: 12px; letter-spacing: .1em; color: #a89070;
    margin: 12px 0 16px; min-height: 18px;
  }
  .status.error { color: #ff7060; }
  .status.pulse { animation: statusPulse 1.6s ease-in-out infinite; }
  @keyframes statusPulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }

  #inputCode {
    width: 100%; padding: 12px;
    font-family: "Courier New", monospace;
    font-size: 24px; font-weight: 700; text-align: center;
    letter-spacing: .2em; text-transform: uppercase;
    background: rgba(0,0,0,.4);
    border: 1px solid rgba(214,168,110,.4);
    border-radius: 8px; color: #ffcc70; outline: none; margin-bottom: 12px;
  }
  #inputCode:focus { border-color: rgba(255,180,80,.8); box-shadow: 0 0 12px rgba(255,150,60,.3); }

  #leaveBtn {
    position: absolute;
    top: calc(var(--safe-t) + 12px); right: 12px;
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(40,27,16,.85);
    border: 1px solid rgba(214,168,110,.4);
    color: #d0b090; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto; cursor: pointer; z-index: 10;
  }
  #leaveBtn:active { background: rgba(90,30,20,.9); }

  #netBadge {
    position: absolute;
    top: calc(var(--safe-t) + 12px); left: 12px;
    padding: 4px 10px;
    font-size: 10px; letter-spacing: .15em;
    color: #90c090;
    background: rgba(20,40,20,.7);
    border: 1px solid rgba(90,180,90,.35);
    border-radius: 6px; display: none;
  }
  #netBadge.show { display: block; }
  #netBadge.host { color: #90c0ff; border-color: rgba(90,140,220,.4); background: rgba(20,30,50,.7); }
</style>
</head>
<body>

<div id="hud">
  <div id="scorebar">
    <div class="side you"><span class="label" id="labelLeft">YOU</span><span class="num" id="sp">0</span></div>
    <div class="divider">–</div>
    <div class="side cpu"><span class="num" id="sa">0</span><span class="label" id="labelRight">CPU</span></div>
  </div>
  <div id="banner"></div>
  <div id="hint">タップ＆ドラッグでパドル操作</div>
</div>
<div id="vignette"></div>
<div id="flash"></div>

<button id="leaveBtn" style="display:none;">×</button>
<div id="netBadge"></div>

<div id="overlay">
  <div class="panel">
    <h1>AIR HOCKEY</h1>
    <div class="subtitle">P2P ARCADE</div>

    <div id="menuPanel">
      <button class="btn primary" id="btnSolo">1人でプレイ</button>
      <button class="btn" id="btnCreate">部屋を作る</button>
      <button class="btn" id="btnJoin">部屋に参加</button>
    </div>

    <div id="createPanel" class="hidden">
      <div style="font-size:12px;color:#a89070;letter-spacing:.1em;">ルームコード</div>
      <div class="code-display" id="roomCode">------</div>
      <button class="btn" id="btnCopyCode" style="margin-bottom:14px;">コードをコピー</button>
      <div class="status pulse" id="createStatus">相手の参加を待っています...</div>
      <button class="btn" id="btnCancelCreate">キャンセル</button>
    </div>

    <div id="joinPanel" class="hidden">
      <div style="font-size:12px;color:#a89070;letter-spacing:.1em;margin-bottom:8px;">ルームコードを入力</div>
      <input type="text" id="inputCode" maxlength="6" placeholder="XXXXXX" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" />
      <button class="btn primary" id="btnConnect">接続</button>
      <div class="status" id="joinStatus"></div>
      <button class="btn" id="btnCancelJoin">キャンセル</button>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   定数
   ============================================================ */
const W          = 1.0;
const L          = 2.0;
const GOAL_HALF  = 0.45;
const PUCK_R     = 0.085;
const MALLET_R   = 0.15;
const RIM_T      = 0.085;
const RIM_H      = 0.135;

const W2 = W + RIM_T;
const L2 = L + RIM_T;

const FLOOR_Y  = -1.60;
const SKIRT_B  = -0.55;
const SKIRT_HX = 0.99;
const SKIRT_HZ = 1.99;

const MAX_PUCK_V   = 9.5;
const MAX_MALLET_V = 9.0;
const AI_SPEED     = 2.35;
const WIN_SCORE    = 7;
const FIXED        = 1 / 200;

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

/* ============================================================
   レンダラ
   ============================================================ */
const renderer = new THREE.WebGLRenderer({
  antialias: true, powerPreference: 'high-performance', stencil: false,
});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0806);
scene.fog = new THREE.FogExp2(0x0a0806, 0.052);

/* ============================================================
   カメラ
   ============================================================ */
let camSide = 1;
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.05, 140);
const currentLookAt = new THREE.Vector3(0, 0, -0.35);
const camBase = new THREE.Vector3();
const camDist = { value: 7.5 };
let shake = 0;

const fitCam = new THREE.PerspectiveCamera(55, 1, 0.05, 200);
const fitTgt = new THREE.Vector3(0, 0, 0);
const fitCorners = [
  new THREE.Vector3(-W2 - 0.02, 0, -L2 - 0.02),
  new THREE.Vector3( W2 + 0.02, 0, -L2 - 0.02),
  new THREE.Vector3(-W2 - 0.02, 0,  L2 + 0.02),
  new THREE.Vector3( W2 + 0.02, 0,  L2 + 0.02),
];
const fitProj = new THREE.Vector3();

function computeCameraDistance() {
  const aspect = Math.max(0.2, innerWidth / innerHeight);
  fitCam.aspect = aspect;
  fitCam.fov = 55;
  fitCam.updateProjectionMatrix();

  const camDir = new THREE.Vector3(0, 1, camSide).normalize();
  let lo = 2.0, hi = 34.0;
  for (let i = 0; i < 26; i++) {
    const mid = (lo + hi) * 0.5;
    fitCam.position.copy(fitTgt).addScaledVector(camDir, mid);
    fitCam.lookAt(fitTgt);
    fitCam.updateMatrixWorld();
    fitCam.updateProjectionMatrix();

    let fits = true;
    for (const c of fitCorners) {
      fitProj.copy(c).project(fitCam);
      if (Math.abs(fitProj.x) > 0.92 || Math.abs(fitProj.y) > 0.92 || fitProj.z > 1 || fitProj.z < -1) {
        fits = false; break;
      }
    }
    if (fits) hi = mid; else lo = mid;
  }
  return hi;
}

function updateCamera() {
  camera.aspect = innerWidth / innerHeight;
  camDist.value = computeCameraDistance();
  const camDir = new THREE.Vector3(0, 1, camSide).normalize();
  currentLookAt.set(0, 0, -0.35 * camSide);
  camBase.copy(currentLookAt).addScaledVector(camDir, camDist.value);
  camera.position.copy(camBase);
  camera.lookAt(currentLookAt);
  camera.updateProjectionMatrix();
}

/* ============================================================
   ライト
   ============================================================ */
scene.add(new THREE.AmbientLight(0x40301f, 0.62));
scene.add(new THREE.HemisphereLight(0xffd9a8, 0x1f150c, 0.50));

const keyLight = new THREE.SpotLight(0xffe6c4, 52, 10, 0.78, 0.82, 2);
keyLight.position.set(0.6, 3.05, 1.35);
keyLight.target.position.set(0, 0, -0.30);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(512, 512);
keyLight.shadow.camera.near = 1.2;
keyLight.shadow.camera.far  = 7.5;
keyLight.shadow.bias = -0.0018;
keyLight.shadow.radius = 2;
scene.add(keyLight, keyLight.target);

/* ---- 修正: Object.assign で position を上書きしない ---- */
{
  const l1 = new THREE.PointLight(0xffc98a, 9,   8,   2); l1.position.set(-2.6,  1.3,  1.6); scene.add(l1);
  const l2 = new THREE.PointLight(0xff9a6a, 7,   8,   2); l2.position.set( 2.6,  1.2, -1.6); scene.add(l2);
  const l3 = new THREE.PointLight(0xffb070, 3.4, 3.0, 2); l3.position.set( 0,   -0.95, 0.4); scene.add(l3);
  const l4 = new THREE.PointLight(0xffb070, 6,   6.5, 2); l4.position.set( 0,    1.6, -4.8); scene.add(l4);
  const l5 = new THREE.PointLight(0xff4f9d, 4,   4.5, 2); l5.position.set(-3.6,  1.0, -4.0); scene.add(l5);
}

/* ============================================================
   環境マップ
   ============================================================ */
function createEnvTexture() {
  const w = 256, h = 128;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0.00, '#221a10'); grad.addColorStop(0.35, '#3c2d1c');
  grad.addColorStop(0.52, '#2a2014'); grad.addColorStop(0.75, '#130e08');
  grad.addColorStop(1.00, '#0a0705');
  g.fillStyle = grad; g.fillRect(0, 0, w, h);
  const spots = [[w*0.50,h*0.13,50,0.95],[w*0.14,h*0.17,29,0.55],[w*0.86,h*0.17,29,0.55]];
  for (const [cx, cy, r, a] of spots) {
    const rg = g.createRadialGradient(cx, cy, 0, cx, cy, r);
    rg.addColorStop(0,    `rgba(255,228,182,${a})`);
    rg.addColorStop(0.45, `rgba(255,190,120,${a * 0.28})`);
    rg.addColorStop(1,    'rgba(0,0,0,0)');
    g.fillStyle = rg; g.fillRect(0, 0, w, h);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
scene.environment = pmrem.fromEquirectangular(createEnvTexture()).texture;
pmrem.dispose();

/* ============================================================
   テクスチャ
   ============================================================ */
function rr(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}
function createWoodTexture(base) {
  const S = 256, cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const g = cv.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 120; i++) {
    const y0 = Math.random()*S, amp = 1+Math.random()*3.5, fr = 0.008+Math.random()*0.04, ph = Math.random()*Math.PI*2, a = 0.03+Math.random()*0.09;
    g.beginPath();
    for (let x = 0; x <= S; x += 5) {
      const yy = y0 + Math.sin(x*fr+ph)*amp + Math.sin(x*fr*3.3+ph*1.7)*amp*0.3;
      x === 0 ? g.moveTo(x, yy) : g.lineTo(x, yy);
    }
    g.strokeStyle = Math.random() < 0.55 ? `rgba(38,22,10,${a})` : `rgba(205,165,115,${a*0.6})`;
    g.lineWidth = 0.6 + Math.random()*1.6; g.stroke();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(2, 2); tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}
function createPlayfieldTexture() {
  const S = 300, cw = Math.round(2*W*S), ch = Math.round(2*L*S);
  const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
  const g = cv.getContext('2d');
  const X = x => (x + W) * S, Z = z => (z + L) * S;
  const bg = g.createLinearGradient(0, 0, cw, ch);
  bg.addColorStop(0, '#e6e0d2'); bg.addColorStop(0.5, '#f5f0e4'); bg.addColorStop(1, '#e2dbcc');
  g.fillStyle = bg; g.fillRect(0, 0, cw, ch);
  const rg = g.createRadialGradient(cw/2, ch/2, 0, cw/2, ch/2, ch*0.55);
  rg.addColorStop(0, 'rgba(255,253,242,0.55)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = rg; g.fillRect(0, 0, cw, ch);
  for (let i = 0; i < 140; i++) {
    const x = Math.random()*cw, y = Math.random()*ch, r = 6+Math.random()*50, a = 0.01+Math.random()*0.025;
    const rg2 = g.createRadialGradient(x, y, 0, x, y, r);
    rg2.addColorStop(0, `rgba(${Math.random()<0.5?'120,105,80':'255,255,246'},${a})`);
    rg2.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rg2; g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill();
  }
  g.strokeStyle = 'rgba(74,66,54,0.5)'; g.lineWidth = 5;
  g.strokeRect(X(-W)+11, Z(-L)+11, 2*W*S-22, 2*L*S-22);
  g.strokeStyle = '#bc322e'; g.lineWidth = 0.05*S;
  g.beginPath(); g.moveTo(0, Z(0)); g.lineTo(cw, Z(0)); g.stroke();
  g.lineWidth = 0.032*S;
  g.beginPath(); g.arc(X(0), Z(0), 0.44*S, 0, Math.PI*2); g.stroke();
  g.fillStyle = '#bc322e';
  g.beginPath(); g.arc(X(0), Z(0), 0.052*S, 0, Math.PI*2); g.fill();
  g.strokeStyle = '#2f5ea3';
  for (const sz of [-1, 1]) {
    g.lineWidth = 0.032*S;
    g.beginPath(); g.arc(X(0), Z(sz*L), 0.92*S, sz<0?0:Math.PI, sz<0?Math.PI:Math.PI*2); g.stroke();
    g.lineWidth = 0.028*S;
    g.beginPath(); g.arc(X(0), Z(sz*1.05), 0.24*S, 0, Math.PI*2); g.stroke();
    g.fillStyle = '#2f5ea3';
    g.beginPath(); g.arc(X(0), Z(sz*1.05), 0.042*S, 0, Math.PI*2); g.fill();
  }
  g.fillStyle = 'rgba(188,50,46,0.16)';
  g.fillRect(X(-GOAL_HALF), Z(-L), GOAL_HALF*2*S, 0.16*S);
  g.fillRect(X(-GOAL_HALF), Z(L)-0.16*S, GOAL_HALF*2*S, 0.16*S);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}
function createNetTexture() {
  const S = 64, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const g = cv.getContext('2d'); g.clearRect(0, 0, S, S);
  g.strokeStyle = 'rgba(200,200,195,0.85)'; g.lineWidth = 2;

let actx = null;
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
}
function beep(freq, dur, vol, type = 'triangle') {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t+dur+0.02);
}

const net = {
  mode: 'local',
  peer: null,
  conn: null,
  connected: false,
  sendAccum: 0,
  inputAccum: 0,
};
const netBuffer = { puck: [], player: [], delay: 80 };

function trimBuffer(buf, now) {
  while (buf.length > 90) buf.shift();
  const cutoff = now - 2000;
  while (buf.length > 0 && buf[0].time < cutoff) buf.shift();
}
function interpolateBuffer(buf, now) {
  if (buf.length === 0) return null;
  if (buf.length === 1) return buf[0];
  const target = now - netBuffer.delay;
  if (target <= buf[0].time) return buf[0];
  if (target >= buf[buf.length-1].time) return buf[buf.length-1];
  for (let i = 0; i < buf.length-1; i++) {
    if (buf[i].time <= target && target <= buf[i+1].time) {
      const t = (target - buf[i].time) / (buf[i+1].time - buf[i].time);
      return { x: buf[i].x + (buf[i+1].x - buf[i].x) * t, z: buf[i].z + (buf[i+1].z - buf[i].z) * t };
    }
  }
  return buf[buf.length-1];
}

function broadcastState() {
  if (!net.conn || !net.conn.open) return;
  net.conn.send({
    type: 'state',
    puck:   { x: state.puck.x, z: state.puck.z },
    player: { x: state.player.x, z: state.player.z },
    scoreP: state.scoreP, scoreA: state.scoreA,
    frozen: state.frozen, over: state.over,
  });
}
function onHostData(data) {
  if (data.type === 'input') {
    state.ai.tx = data.tx; state.ai.tz = data.tz;
  } else if (data.type === 'restartRequest') {
    if (state.over) { restart(); broadcastState(); }
  } else if (data.type === 'bye') {
    handleDisconnect('相手が退出しました');
  }
}
function onGuestData(data) {
  if (data.type !== 'state') return;
  const now = performance.now();
  netBuffer.puck.push({ x: data.puck.x, z: data.puck.z, time: now });
  netBuffer.player.push({ x: data.player.x, z: data.player.z, time: now });
  trimBuffer(netBuffer.puck, now);
  trimBuffer(netBuffer.player, now);

  state.scoreP = data.scoreP;
  state.scoreA = data.scoreA;
  updateScoreUI();

  const wasOver = state.over;
  state.frozen = data.frozen;
  state.over = data.over;

  if (state.over && !wasOver) {
    const guestWon = state.scoreA > state.scoreP;
    showBanner(guestWon ? 'YOU WIN!' : 'HOST WINS', guestWon ? 'you' : 'cpu');
    setTimeout(sfxWin, 200);
    vibrate([40, 60, 40, 60, 100]);
  }
  if (!state.over && wasOver) hideBanner();
}
function sendGuestInput() {
  if (!net.conn || !net.conn.open) return;
  net.conn.send({ type: 'input', tx: state.guestTarget.x, tz: state.guestTarget.z });
}
function genRoomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}
function handleDisconnect(msg) {
  if (net.mode === 'local') return;
  try { if (net.conn) net.conn.close(); } catch (e) {}
  try { if (net.peer) net.peer.destroy(); } catch (e) {}
  net.conn = null;
  net.peer = null;
  net.connected = false;
  net.mode = 'local';
  state.frozen = true;
  state.over = false;
  document.getElementById('netBadge').classList.remove('show');
  document.getElementById('leaveBtn').style.display = 'none';
  document.getElementById('overlay').classList.remove('hidden');
  showMenuPanel();
}

let createAttempt = 0;
function createRoom() { createAttempt = 0; tryCreateRoom(); }
function tryCreateRoom() {
  const code = genRoomCode();
  const peer = new Peer(code);
  peer.on('open', (id) => {
    net.peer = peer;
    net.mode = 'host';
    document.getElementById('roomCode').textContent = id;
    document.getElementById('createStatus').textContent = '相手の参加を待っています...';
    document.getElementById('createStatus').classList.remove('error');
    document.getElementById('createStatus').classList.add('pulse');
  });
  peer.on('error', (err) => {
    if (err.type === 'unavailable-id' && createAttempt < 5) {
      createAttempt++;
      try { peer.destroy(); } catch (e) {}
      tryCreateRoom();
    } else {
      const el = document.getElementById('createStatus');
      el.textContent = 'ルーム作成に失敗: ' + err.type;
      el.classList.add('error');
      el.classList.remove('pulse');
    }
  });
  peer.on('connection', (conn) => {
    if (net.conn) { try { conn.close(); } catch (e) {} return; }
    net.conn = conn;
    conn.on('open', () => { net.connected = true; startOnlineGame('host'); });
    conn.on('data', onHostData);
    conn.on('close', () => handleDisconnect('相手が退出しました'));
    conn.on('error', () => handleDisconnect('通信エラー'));
  });
}
let joinTimeout = 0;
function joinRoom(code) {
  code = code.trim().toUpperCase();
  if (code.length !== 6) { showJoinError('6文字のコードを入力してください'); return; }
  const peer = new Peer();
  peer.on('open', () => {
    const conn = peer.connect(code, { reliable: true });
    joinTimeout = setTimeout(() => {
      if (!net.connected) {
        try { peer.destroy(); } catch (e) {}
        showJoinError('接続できませんでした');
      }
    }, 12000);
    conn.on('open', () => {
      clearTimeout(joinTimeout);
      net.conn = conn;
      net.peer = peer;
      net.mode = 'guest';
      net.connected = true;
      conn.on('data', onGuestData);
      conn.on('close', () => handleDisconnect('相手が退出しました'));
      conn.on('error', () => handleDisconnect('通信エラー'));
      startOnlineGame('guest');
    });
    conn.on('error', (err) => {
      clearTimeout(joinTimeout);
      showJoinError('接続失敗: ' + (err.type || 'unknown'));
    });
  });
  peer.on('error', (err) => {
    clearTimeout(joinTimeout);
    if (err.type === 'peer-unavailable') showJoinError('そのルームは存在しません');
    else showJoinError('接続失敗: ' + (err.type || 'unknown'));
  });
}

/* ============================================================
   物理
   ============================================================ */
function moveMallet(m, tx, tz, dt, maxSpeed) {
  const dx = tx - m.x, dz = tz - m.z;
  const d = Math.hypot(dx, dz);
  const ox = m.x, oz = m.z;
  if (d > 1e-6) {
    const step = Math.min(d, maxSpeed * dt);
    m.x += (dx/d) * step;
    m.z += (dz/d) * step;
  }
  m.vx = (m.x - ox) / dt;
  m.vz = (m.z - oz) / dt;
}
function collidePuck(p, m) {
  const dx = p.x - m.x, dz = p.z - m.z;
  const minD = PUCK_R + MALLET_R;
  const d2 = dx*dx + dz*dz;
  if (d2 >= minD*minD) return;
  const d = Math.sqrt(d2);
  let nx, nz;
  if (d < 1e-5) { nx = 0; nz = 1; } else { nx = dx/d; nz = dz/d; }
  p.x = m.x + nx*minD;
  p.z = m.z + nz*minD;
  const rvx = p.vx - m.vx, rvz = p.vz - m.vz;
  const vn = rvx*nx + rvz*nz;
  if (vn < 0) {
    const e = 0.95;
    p.vx -= (1+e)*vn*nx;
    p.vz -= (1+e)*vn*nz;
    const sp = Math.hypot(p.vx, p.vz);
    if (sp > MAX_PUCK_V) { const k = MAX_PUCK_V/sp; p.vx *= k; p.vz *= k; }
    sfxHit(Math.min(1, Math.abs(vn)/6));
    vibrate(8);
  }
}
function updateAITarget() {
  const p = state.puck, a = state.ai;
  let tx, tz;
  if (p.z < 0.15) {
    const behind = (MALLET_R + PUCK_R) * 0.92;
    tx = p.x; tz = p.z - behind;
    if (tz < -L + MALLET_R) { tz = -L + MALLET_R; tx = p.x * 0.2; }
  } else {
    tx = p.x * 0.5; tz = -L * 0.55;
  }
  a.tx = clamp(tx, -W + MALLET_R, W - MALLET_R);
  a.tz = clamp(tz, -L + MALLET_R, -0.02);
}
function resetPuck() {
  const p = state.puck;
  p.x = 0; p.z = 0; p.vx = 0; p.vz = 0;
  state.frozen = false;
  puckMesh.visible = true;
  sfxWall();
}
function onGoal(who) {
  state.frozen = true;
  state.goalTimer = 1.0;
  state.puck.vx = 0; state.puck.vz = 0;
  puckMesh.visible = false;
  if (who === 'player') state.scoreP++; else state.scoreA++;
  updateScoreUI();
  flashScreen(who === 'player' ? 'rgba(255,200,120,0.40)' : 'rgba(255,110,80,0.40)');
  shake = 0.12;
  sfxGoal();
  vibrate(who === 'player' ? [30, 40, 60] : [80]);
  const won = state.scoreP >= WIN_SCORE || state.scoreA >= WIN_SCORE;
  if (won) {
    state.over = true;
    if (net.mode === 'host') {
      const hostWon = state.scoreP >= WIN_SCORE;
      showBanner(hostWon ? 'YOU WIN!' : 'GUEST WINS', hostWon ? 'you' : 'cpu');
    } else {
      const hostWon = state.scoreP >= WIN_SCORE;
      showBanner(hostWon ? 'YOU WIN!' : 'CPU WINS', hostWon ? 'you' : 'cpu');
    }
    setTimeout(sfxWin, 200);
    vibrate([40, 60, 40, 60, 100]);
  }
  if (net.mode === 'host') broadcastState();
}
function stepPhysics(dt) {
  const p = state.puck, pl = state.player, ai = state.ai;

  if (net.mode === 'guest') {
    const atx = clamp(state.guestTarget.x, -W + MALLET_R, W - MALLET_R);
    const atz = clamp(state.guestTarget.z, -L + MALLET_R, -0.02);
    moveMallet(ai, atx, atz, dt, MAX_MALLET_V);
    return;
  }

  if (state.frozen) {
    state.goalTimer -= dt;
    if (state.goalTimer <= 0 && !state.over) resetPuck();
  }

  const ptx = clamp(state.playerTarget.x, -W + MALLET_R, W - MALLET_R);
  const ptz = clamp(state.playerTarget.z, 0, L - MALLET_R);
  moveMallet(pl, ptx, ptz, dt, MAX_MALLET_V);

  if (net.mode === 'host') {
    const atx = clamp(state.ai.tx, -W + MALLET_R, W - MALLET_R);
    const atz = clamp(state.ai.tz, -L + MALLET_R, -0.02);
    moveMallet(ai, atx, atz, dt, MAX_MALLET_V);
  } else {
    updateAITarget();
    moveMallet(ai, ai.tx, ai.tz, dt, AI_SPEED);
  }

  if (state.frozen || state.over) return;

  p.x += p.vx * dt;
  p.z += p.vz * dt;
  const damp = Math.exp(-0.28 * dt);
  p.vx *= damp; p.vz *= damp;
  if (Math.abs(p.vx) < 0.015) p.vx = 0;
  if (Math.abs(p.vz) < 0.015) p.vz = 0;

  collidePuck(p, pl);
  collidePuck(p, ai);

  if (p.x < -W + PUCK_R) { p.x = -W + PUCK_R; if (p.vx < 0) { p.vx = -p.vx*0.92; sfxWall(); } }
  else if (p.x > W - PUCK_R) { p.x = W - PUCK_R; if (p.vx > 0) { p.vx = -p.vx*0.92; sfxWall(); } }

  const inMouth = Math.abs(p.x) < GOAL_HALF - PUCK_R*0.5;
  if (p.z < -L && inMouth) { onGoal('player'); return; }
  if (p.z < -L + PUCK_R && !inMouth) { p.z = -L + PUCK_R; if (p.vz < 0) { p.vz = -p.vz*0.92; sfxWall(); } }
  if (p.z > L && inMouth) { onGoal('ai'); return; }
  if (p.z > L - PUCK_R && !inMouth) { p.z = L - PUCK_R; if (p.vz > 0) { p.vz = -p.vz*0.92; sfxWall(); } }
}

/* ============================================================
   HUD
   ============================================================ */
function flashScreen(color) {
  const el = document.getElementById('flash');
  el.style.background = color;
  el.classList.remove('go');
  void el.offsetWidth;
  el.classList.add('go');
}
function showBanner(text, cls) {
  const b = document.getElementById('banner');
  b.className = 'show ' + cls;
  b.innerHTML = `${text}<span class="sub">TAP TO RESTART</span>`;
}
function hideBanner() {
  document.getElementById('banner').className = '';
}

/* ============================================================
   入力
   ============================================================ */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const tablePlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const hitPoint = new THREE.Vector3();

let activePointerId = null;
let firstInteraction = false;

function pointerToTable(clientX, clientY) {
  ndc.x = (clientX / innerWidth) * 2 - 1;
  ndc.y = -(clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  if (raycaster.ray.intersectPlane(tablePlane, hitPoint)) {
    if (net.mode === 'guest') {
      state.guestTarget.x = hitPoint.x;
      state.guestTarget.z = hitPoint.z;
    } else {
      state.playerTarget.x = hitPoint.x;
      state.playerTarget.z = hitPoint.z;
    }
  }
}
function handleFirstInteraction() {
  if (firstInteraction) return;
  firstInteraction = true;
  initAudio();
  const el = document.documentElement;
  try {
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } catch (e) {}
}
const canvas = renderer.domElement;

canvas.addEventListener('pointerdown', (e) => {
  handleFirstInteraction();
  if (state.over) {
    if (net.mode === 'guest') {
      if (net.conn && net.conn.open) net.conn.send({ type: 'restartRequest' });
    } else {
      restart();
      if (net.mode === 'host') broadcastState();
    }
    return;
  }
  activePointerId = e.pointerId;
  pointerToTable(e.clientX, e.clientY);
  vibrate(4);
}, { passive: true });

canvas.addEventListener('pointermove', (e) => {
  if (activePointerId !== null && e.pointerId !== activePointerId) return;
  pointerToTable(e.clientX, e.clientY);
}, { passive: true });

function endPointer(e) {
  if (e.pointerId === activePointerId) activePointerId = null;
}
canvas.addEventListener('pointerup', endPointer, { passive: true });
canvas.addEventListener('pointercancel', endPointer, { passive: true });
canvas.addEventListener('pointerleave', endPointer, { passive: true });

canvas.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });
document.addEventListener('touchmove', (e) => { if (!overlay.classList.contains('hidden')) return; e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());

document.addEventListener('visibilitychange', () => {
  if (document.hidden) lastTime = performance.now() * 0.001;
});

function restart() {
  state.scoreP = 0;
  state.scoreA = 0;
  state.over = false;
  state.frozen = false;
  state.puck.x = 0; state.puck.z = 0;
  state.puck.vx = 0; state.puck.vz = 0;
  state.player.x = 0; state.player.z = L * 0.55;
  state.ai.x = 0; state.ai.z = -L * 0.6;
  state.ai.tx = 0; state.ai.tz = -L * 0.6;
  state.playerTarget.x = 0;
  state.playerTarget.z = L * 0.55;
  state.guestTarget.x = 0;
  state.guestTarget.z = -L * 0.6;
  puckMesh.visible = true;
  netBuffer.puck.length = 0;
  netBuffer.player.length = 0;
  updateScoreUI();
  hideBanner();
}

/* ============================================================
   同期 / ループ
   ============================================================ */
function syncMeshes() {
  const p = state.puck;
  puckMesh.position.set(p.x, 0, p.z);
  playerMalletMesh.position.set(state.player.x, 0, state.player.z);
  aiMalletMesh.position.set(state.ai.x, 0, state.ai.z);
}

let lastTime = performance.now() * 0.001;
let accumulator = 0;

function animate(tMs) {
  requestAnimationFrame(animate);
  const now = tMs * 0.001;
  let dt = now - lastTime;
  lastTime = now;
  if (dt > 0.1) dt = 0.1;
  if (dt < 0) dt = 0;

  accumulator += dt;
  let guard = 0;
  while (accumulator >= FIXED && guard++ < 16) {
    stepPhysics(FIXED);
    accumulator -= FIXED;
  }

  if (net.mode === 'guest') {
    const ms = performance.now();
    const puckI = interpolateBuffer(netBuffer.puck, ms);
    const playerI = interpolateBuffer(netBuffer.player, ms);
    if (puckI) { state.puck.x = puckI.x; state.puck.z = puckI.z; }
    if (playerI) { state.player.x = playerI.x; state.player.z = playerI.z; }
  }

  syncMeshes();

  if (net.mode === 'host') {
    net.sendAccum += dt;
    if (net.sendAccum >= 1/30) { net.sendAccum = 0; broadcastState(); }
  } else if (net.mode === 'guest') {
    net.inputAccum += dt;
    if (net.inputAccum >= 1/45) { net.inputAccum = 0; sendGuestInput(); }
  }

  camera.position.copy(camBase);
  if (shake > 0.0005) {
    camera.position.x += (Math.random() - 0.5) * shake;
    camera.position.y += (Math.random() - 0.5) * shake * 0.6;
    camera.position.z += (Math.random() - 0.5) * shake * 0.4;
    shake *= 0.86;
  } else { shake = 0; }
  camera.lookAt(currentLookAt);

  renderer.render(scene, camera);
}

/* ============================================================
   リサイズ / 起動
   ============================================================ */
let resizeTimer = 0;
function onResize() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    updateCamera();
  }, 60);
}
addEventListener('resize', onResize);
addEventListener('orientationchange', onResize);

const urlParams = new URLSearchParams(location.search);
const autoJoin = urlParams.get('room');
if (autoJoin) {
  showJoinPanel();
  inputCode.value = autoJoin.toUpperCase();
}

updateCamera();
syncMeshes();
requestAnimationFrame(animate);
</script>
